[package]
name = "lenovo-toolkit-setup"
version = "1.0.4"
edition = "2024"
description = "Lenovo Toolkit Setup: installer & uninstaller for Windows"

[[bin]]
name = "lenovo-toolkit-setup"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.31"
flate2 = "1.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.12"
flate2 = "1.1"
